name: VisionCB HIL

# Physical hardware-in-the-loop validation against a real VisionCB-8M-STD
# board (NXP i.MX8M Mini Cortex-M4F). Thin orchestration wrapper only --
# all hardware state-machine logic lives in run_visioncb_hil.py and its
# supporting modules, not here.
#
# Deliberately NEVER triggers on pull_request: this workflow requires the
# dedicated, repo-scoped self-hosted VisionCB runner, and physical HIL must
# never become a required (or even optional) gate on ordinary PR code from
# untrusted branches/forks. Ordinary PR CI stays on GitHub-hosted runners
# via ci.yml.
#
# Triggers:
#   - workflow_dispatch: manual runs, and the release/RC validation
#     mechanism (dispatch with `quarry_ref` set to the release tag/SHA).
#   - schedule: nightly run against current Quarry main, both presence
#     layouts. Cron is always interpreted in UTC by GitHub Actions.
#
# The requested Quarry ref is resolved ONCE, by the `resolve` job, in a
# dedicated CI-only local clone (/home/igor/.cache/visioncb-hil/
# quarry-ci-checkout on the runner host) -- never a developer's interactive
# checkout. tools/resolve_quarry_ref.py refuses any clone that is attached
# to a branch or has local changes. Every layout job then builds from that
# exact SHA (--expect-quarry-sha), so both layouts are always the same
# Quarry commit. The firmware, bindings and host schema compiler are
# rebuilt from it on every run -- nothing generated is checked in or
# reused across commits.

on:
  workflow_dispatch:
    inputs:
      quarry_ref:
        description: "Quarry branch, tag, or commit SHA to validate (release/RC validation: pass the release tag)"
        required: false
        default: main
      presence_layout:
        description: "Generated C presence layout(s) to build and run"
        required: false
        default: both
        type: choice
        options:
          - both
          - default
          - optimize-size
  schedule:
    # 03:17 UTC nightly -- low-contention offset-minute slot, avoids the
    # top-of-hour cron pileup on GitHub's shared scheduler.
    - cron: "17 3 * * *"

# Exactly one physical VisionCB hardware session at a time. A second run
# (e.g. a nightly firing while a manual run is still in progress) queues
# behind the active one rather than cancelling it -- cancel-in-progress is
# deliberately false so an in-progress hardware session is never interrupted
# mid-sequence.
concurrency:
  group: visioncb-hil-hardware
  cancel-in-progress: false

permissions:
  contents: read

env:
  QUARRY_CI_CHECKOUT: /home/igor/.cache/visioncb-hil/quarry-ci-checkout

jobs:
  resolve:
    name: Resolve Quarry ref
    runs-on: [self-hosted, linux, x64, visioncb, cortex-m4]
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      layouts: ${{ steps.resolve.outputs.layouts }}
    steps:
      - name: Checkout quarry-hil
        uses: actions/checkout@v4

      - name: Resolve requested Quarry ref
        id: resolve
        run: |
          set -euo pipefail
          REF="${{ inputs.quarry_ref || 'main' }}"
          SHA=$(python3 tools/resolve_quarry_ref.py --ref "$REF" --quarry-ci-checkout "$QUARRY_CI_CHECKOUT")
          case "${{ inputs.presence_layout || 'both' }}" in
            both) LAYOUTS='["default","optimize-size"]' ;;
            default) LAYOUTS='["default"]' ;;
            optimize-size) LAYOUTS='["optimize-size"]' ;;
          esac
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "layouts=$LAYOUTS" >> "$GITHUB_OUTPUT"
          {
            echo "### Quarry ref resolved"
            echo "Requested: \`$REF\` -> \`$SHA\`"
            echo "Presence layouts: \`$LAYOUTS\`"
            echo "quarry-hil: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

  hil:
    name: VisionCB HIL (${{ matrix.layout }})
    needs: resolve
    runs-on: [self-hosted, linux, x64, visioncb, cortex-m4]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        layout: ${{ fromJSON(needs.resolve.outputs.layouts) }}
    # Generous but bounded: a healthy run is a few minutes (host compiler
    # build on a new Quarry commit, then ~2 min of hardware); this leaves
    # headroom for slow boot/retry without risking an indefinitely hung job.
    # The runner itself retries a hung board exactly once (power-cycle);
    # RECOVERY_REQUIRED then exits promptly.
    timeout-minutes: 30
    steps:
      - name: Checkout quarry-hil
        uses: actions/checkout@v4

      - name: Run VisionCB HIL
        id: hil
        run: |
          set +e
          python3 boards/visioncb-8m-std/run_visioncb_hil.py \
            --quarry-ref "${{ needs.resolve.outputs.sha }}" \
            --expect-quarry-sha "${{ needs.resolve.outputs.sha }}" \
            --quarry-ci-checkout "$QUARRY_CI_CHECKOUT" \
            --presence-layout "${{ matrix.layout }}"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Locate run directory
        id: rundir
        if: always()
        run: |
          set -euo pipefail
          LATEST=$(ls -td boards/visioncb-8m-std/runs/*-${{ matrix.layout }}/ | head -1)
          echo "run_dir=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Summarize result
        if: always()
        run: python3 tools/summarize_result.py "${{ steps.rundir.outputs.run_dir }}result.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HIL result artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visioncb-hil-result-${{ matrix.layout }}-${{ github.run_id }}
          path: |
            ${{ steps.rundir.outputs.run_dir }}result.json
            ${{ steps.rundir.outputs.run_dir }}runner.log
            ${{ steps.rundir.outputs.run_dir }}console.log
            ${{ steps.rundir.outputs.run_dir }}build_manifest.json
            ${{ steps.rundir.outputs.run_dir }}build.log
          retention-days: 90
          if-no-files-found: warn

      - name: Fail job on non-PASS result
        if: always()
        run: |
          case "${{ steps.hil.outputs.exit_code }}" in
            0) echo "PASS" ;;
            1) echo "::error::VisionCB HIL (${{ matrix.layout }}): Quarry codec TEST_FAILURE (exit 1) -- see uploaded result.json"; exit 1 ;;
            2) echo "::error::VisionCB HIL (${{ matrix.layout }}): INFRASTRUCTURE_ERROR (exit 2) -- build, binding or device problem, not a codec verdict; see runner.log"; exit 1 ;;
            3) echo "::error::VisionCB HIL (${{ matrix.layout }}): RECOVERY_REQUIRED (exit 3) -- board still unresponsive after an automatic relay power-cycle retry, needs physical investigation"; exit 1 ;;
            *) echo "::error::VisionCB HIL (${{ matrix.layout }}): unexpected exit code ${{ steps.hil.outputs.exit_code }}"; exit 1 ;;
          esac
