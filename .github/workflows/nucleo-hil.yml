name: NUCLEO-F446RE HIL

# Physical hardware-in-the-loop validation against a real NUCLEO-F446RE
# board (STM32F446RE, standalone -- no OS/U-Boot/eMMC, unlike VisionCB).
# Thin orchestration wrapper only -- all hardware state-machine logic
# lives in run_nucleo_hil.py and its supporting modules, not here. Mirrors
# visioncb-hil.yml's structure; see that file for the fuller rationale on
# points that are identical here (never triggering on pull_request, the
# resolve-once/build-from-that-SHA flow, rebuilding everything per run).
#
# Runs on the same physical host/self-hosted runner as VisionCB HIL (one
# host, two boards, two separate USB connections) -- targeted here via the
# runner's existing generic `cortex-m4` label rather than a new
# board-specific one. GitHub Actions only ever executes one job at a time
# on a given runner instance, so this and VisionCB HIL can never physically
# collide even though they use different concurrency groups.
#
# Both workflows share the dedicated CI-only Quarry clone. That is safe
# even when their jobs interleave, because every hardware job checks out
# its own resolved SHA explicitly (--quarry-ref SHA) and verifies it
# (--expect-quarry-sha) instead of trusting whatever is checked out.
#
# Triggers:
#   - workflow_dispatch: manual runs, and the release/RC validation
#     mechanism (dispatch with `quarry_ref` set to the release tag/SHA).
#   - schedule: nightly run against current Quarry main, both presence
#     layouts, offset 20 minutes after VisionCB's 03:17 UTC slot.

on:
  workflow_dispatch:
    inputs:
      quarry_ref:
        description: "Quarry branch, tag, or commit SHA to validate (release/RC validation: pass the release tag)"
        required: false
        default: main
      presence_layout:
        description: "Generated C presence layout(s) to build and run"
        required: false
        default: both
        type: choice
        options:
          - both
          - default
          - optimize-size
  schedule:
    - cron: "37 3 * * *"

# Exactly one physical NUCLEO-F446RE hardware session at a time. A second
# run queues behind the active one rather than cancelling it.
concurrency:
  group: nucleo-hil-hardware
  cancel-in-progress: false

permissions:
  contents: read

env:
  QUARRY_CI_CHECKOUT: /home/igor/.cache/visioncb-hil/quarry-ci-checkout

jobs:
  resolve:
    name: Resolve Quarry ref
    runs-on: [self-hosted, linux, x64, cortex-m4]
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      layouts: ${{ steps.resolve.outputs.layouts }}
    steps:
      - name: Checkout quarry-hil
        uses: actions/checkout@v4

      - name: Resolve requested Quarry ref
        id: resolve
        run: |
          set -euo pipefail
          REF="${{ inputs.quarry_ref || 'main' }}"
          SHA=$(python3 tools/resolve_quarry_ref.py --ref "$REF" --quarry-ci-checkout "$QUARRY_CI_CHECKOUT")
          case "${{ inputs.presence_layout || 'both' }}" in
            both) LAYOUTS='["default","optimize-size"]' ;;
            default) LAYOUTS='["default"]' ;;
            optimize-size) LAYOUTS='["optimize-size"]' ;;
          esac
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "layouts=$LAYOUTS" >> "$GITHUB_OUTPUT"
          {
            echo "### Quarry ref resolved"
            echo "Requested: \`$REF\` -> \`$SHA\`"
            echo "Presence layouts: \`$LAYOUTS\`"
            echo "quarry-hil: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

  hil:
    name: NUCLEO-F446RE HIL (${{ matrix.layout }})
    needs: resolve
    runs-on: [self-hosted, linux, x64, cortex-m4]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        layout: ${{ fromJSON(needs.resolve.outputs.layouts) }}
    # Generous but bounded: a healthy run is well under a minute of
    # hardware (flash + a sub-second UART transfer), plus a host compiler
    # build the first time a Quarry commit is seen. The runner never
    # retries a hung board -- RECOVERY_REQUIRED exits promptly.
    timeout-minutes: 25
    steps:
      - name: Checkout quarry-hil
        uses: actions/checkout@v4

      - name: Run NUCLEO-F446RE HIL
        id: hil
        run: |
          set +e
          python3 boards/nucleo-f446re/run_nucleo_hil.py \
            --quarry-ref "${{ needs.resolve.outputs.sha }}" \
            --expect-quarry-sha "${{ needs.resolve.outputs.sha }}" \
            --quarry-ci-checkout "$QUARRY_CI_CHECKOUT" \
            --presence-layout "${{ matrix.layout }}"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Locate run directory
        id: rundir
        if: always()
        run: |
          set -euo pipefail
          LATEST=$(ls -td boards/nucleo-f446re/runs/*-${{ matrix.layout }}/ | head -1)
          echo "run_dir=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Summarize result
        if: always()
        run: |
          python3 tools/summarize_result.py "${{ steps.rundir.outputs.run_dir }}result.json" >> "$GITHUB_STEP_SUMMARY"
          if python3 -c 'import json,sys; sys.exit(json.load(open(sys.argv[1])).get("result_transport") != "swd")' "${{ steps.rundir.outputs.run_dir }}result.json"; then
            echo "::warning::NUCLEO-F446RE HIL: UART was silent, result read over SWD instead -- ST-LINK VCP bridge stuck; replug the board's USB cable to restore it"
          fi

      - name: Upload HIL result artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nucleo-hil-result-${{ matrix.layout }}-${{ github.run_id }}
          path: |
            ${{ steps.rundir.outputs.run_dir }}result.json
            ${{ steps.rundir.outputs.run_dir }}runner.log
            ${{ steps.rundir.outputs.run_dir }}console.log
            ${{ steps.rundir.outputs.run_dir }}build_manifest.json
            ${{ steps.rundir.outputs.run_dir }}build.log
          retention-days: 90
          if-no-files-found: warn

      - name: Fail job on non-PASS result
        if: always()
        run: |
          case "${{ steps.hil.outputs.exit_code }}" in
            0) echo "PASS" ;;
            1) echo "::error::NUCLEO-F446RE HIL (${{ matrix.layout }}): Quarry codec TEST_FAILURE (exit 1) -- see uploaded result.json"; exit 1 ;;
            2) echo "::error::NUCLEO-F446RE HIL (${{ matrix.layout }}): INFRASTRUCTURE_ERROR (exit 2) -- build, binding or device problem, not a codec verdict; see runner.log"; exit 1 ;;
            3) echo "::error::NUCLEO-F446RE HIL (${{ matrix.layout }}): RECOVERY_REQUIRED (exit 3) -- board needs a physical check (USB/ST-LINK connection) before the next run"; exit 1 ;;
            *) echo "::error::NUCLEO-F446RE HIL (${{ matrix.layout }}): unexpected exit code ${{ steps.hil.outputs.exit_code }}"; exit 1 ;;
          esac
